name: Windows release build (vanilla MP fork)

# Builds the multiplayer (SSE) Windows exe plus the launcher and keeps them as a downloadable
# artifact. Everyone in a multiplayer game must use the exact same exe, so the same binary is
# saved under all three names the launcher looks for (Alice.exe, AliceSSE.exe, Alice512.exe).
# That way single player and multiplayer run the same build on every CPU.
#
# Two compilers are tried side by side: clang-cl (upgraded to the newest LLVM, closest to what the
# upstream developers use) and MSVC (what upstream CI builds with). Use one zip for everyone.

on:
  workflow_dispatch:
  push:
    branches: [ vanilla-mp-fixes ]

jobs:
  windows-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang
            preset: x64-release-win-clang-sse
          - compiler: msvc
            preset: x64-release-windows-sse
    runs-on: windows-latest
    name: Windows release (${{ matrix.compiler }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upgrade LLVM to the newest release (clang only)
        if: matrix.compiler == 'clang'
        shell: pwsh
        run: choco upgrade llvm -y --no-progress

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then echo "::notice::$(clang-cl --version | head -1)"; else echo "::notice::$(cl 2>&1 | head -1)"; fi
          cmake --preset=${{ matrix.preset }} -G Ninja

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build out/build/${{ matrix.preset }} --parallel --target Alice launch_alice 2>&1 | tee build.log; then
            # surface the first real compiler errors as annotations (readable through the API without downloading the log)
            grep -E "(: error|: fatal error|error C[0-9]+|error LNK[0-9]+|FAILED:)" build.log | head -10 | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
            exit 1
          fi

      - name: Package
        shell: pwsh
        run: |
          $build = "out/build/${{ matrix.preset }}"
          $pkg = "package"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          $alice = Get-ChildItem $build -Recurse -Filter Alice.exe | Select-Object -First 1
          $launcher = Get-ChildItem $build -Recurse -Filter launch_alice.exe | Select-Object -First 1
          if (-not $alice -or -not $launcher) { throw "Build outputs not found" }
          foreach ($name in @("Alice.exe", "AliceSSE.exe", "Alice512.exe")) { Copy-Item $alice.FullName "$pkg/$name" }
          Copy-Item $launcher.FullName "$pkg/launch_alice.exe"
          Copy-Item libs/*.dll $pkg
          Get-ChildItem $alice.DirectoryName -Filter *.dll | Copy-Item -Destination $pkg
          Copy-Item -Recurse assets "$pkg/assets"
          @"
          Built with: ${{ matrix.compiler }}
          Install: copy everything in this folder into your Victoria 2 folder (next to v2game.exe),
          then start launch_alice.exe. Everyone in a multiplayer game needs this same build.

          Multiplayer pacing (host only), in %LOCALAPPDATA%\Project Alice\host_settings.json:
            alice_max_days_ahead   - host never runs more than this many days ahead of the slowest player (default 3, 0 = off)
            alice_max_wait_seconds - how long the host waits for a frozen player before carrying on (default 20)
          "@ | Out-File -Encoding utf8 "$pkg/README_FORK.txt"
          "::notice::packaged $((Get-ChildItem $pkg -Recurse | Measure-Object -Property Length -Sum).Sum) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: alice-vanilla-mp-windows-${{ matrix.compiler }}
          path: package
